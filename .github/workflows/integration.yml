name: Integration

# Real Claude Code sessions (tools/integration.py). They call the model, so this runs only when
# started by hand, and only with an ANTHROPIC_API_KEY repository secret.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claude-code:
    name: Claude Code ${{ matrix.claude }}
    strategy:
      fail-fast: false
      matrix:
        claude: ["2.1.163", latest]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Claude Code ${{ matrix.claude }}
        run: npm install --global --no-audit --no-fund "@anthropic-ai/claude-code@${{ matrix.claude }}"
      - name: Run the integration check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Set the ANTHROPIC_API_KEY repository secret to run the integration check"
            exit 1
          fi
          python tools/integration.py --model haiku
